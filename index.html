<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ThoughtDrop</title>
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-180.png"><meta name="theme-color" content="#ff5a36"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ThoughtDrop">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: quick, private, like texting yourself at 2am
   IDEA: a message thread with your own brain; every text becomes a sorted card
   PICTURE: the live feed and the send bubble are the picture
   COLOUR+TYPE: white or ink ground, one hot "sent" accent, Figtree throughout
   LAYOUT: app bar + view tabs, content column, composer pinned to the bottom */
:root{color-scheme:light dark;--bg:light-dark(#f6f7f9,#0f1014);--panel:light-dark(#fff,#191b21);--ink:light-dark(#15161b,#eceef3);--mute:light-dark(#646977,#9ba0ad);--line:light-dark(#e3e5ea,#2a2d36);--chip:light-dark(#eef0f4,#24272f);--acc:#ff5a36;--warn:light-dark(#c62828,#ff7b72);--ok:light-dark(#17804a,#4ad08a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif;overflow-x:clip;display:flex;flex-direction:column}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.top{display:flex;align-items:center;gap:12px;padding:12px max(4vw,14px) 0;max-width:1100px;width:100%;margin:0 auto}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;letter-spacing:-.02em}
.logo b{width:34px;height:34px;border-radius:12px 12px 12px 4px;background:var(--acc);display:grid;place-items:center;color:#fff}
.sync{margin-left:auto;font-size:13px;color:var(--mute);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--mute)}.sync.ok i{background:var(--ok)}.sync.bad i{background:var(--warn)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding:10px max(4vw,14px);max-width:1100px;width:100%;margin:0 auto;scrollbar-width:none}
nav.tabs a{flex:none;text-decoration:none;color:var(--mute);font-weight:600;padding:9px 14px;border-radius:999px;min-height:40px;display:flex;align-items:center}
nav.tabs a.on{background:var(--ink);color:var(--bg)}
main{flex:1;overflow-y:auto;width:100%}
.wrap{max-width:1100px;margin:0 auto;padding:4px max(4vw,14px) 24px}
.feedwrap{max-width:720px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.search{flex:1 1 220px;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:0 12px;min-height:44px}
.search input{border:0;background:none;outline:0;flex:1;font-size:16px;min-height:42px}
.seg{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.seg button,.tag{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;min-height:36px;color:var(--mute)}
.seg button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tag{min-height:28px;padding:2px 10px;font-size:13px;background:var(--chip);border-color:transparent;color:var(--ink)}
.tag.on{background:var(--acc);color:#fff}
.banner{border:2px solid var(--warn);border-radius:18px;padding:10px 12px 4px;margin-bottom:14px}
.banner h2{font-size:15px;margin:0 0 6px;color:var(--warn);display:flex;gap:6px;align-items:center}
.list{display:grid;gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 18px 6px;padding:12px 14px 10px;box-shadow:0 1px 0 var(--line);animation:pop .25s ease-out}
.card.pin{border-color:var(--acc)}
.card.isdone{opacity:.62}
.card header{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute)}
.card header .kind{display:flex;align-items:center;gap:5px;font-weight:600}
.card header .kind svg{width:15px;height:15px}
.card header time{margin-left:auto}
.pinmark{color:var(--acc);display:flex}.pinmark svg{width:15px;height:15px}
.card h3{margin:6px 0 4px;font-size:17px}
.txt{margin:6px 0 8px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:16.5px}
.card a{color:var(--acc);overflow-wrap:anywhere}
.struck{text-decoration:line-through;color:var(--mute)}
.items{list-style:none;margin:4px 0;padding:0}
.items li{display:flex;align-items:center;gap:8px;padding:2px 0;overflow-wrap:anywhere}
.tick{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:none;display:grid;place-items:center;flex:none;color:transparent;padding:0}
.tick svg{width:16px;height:16px}.tick.on{background:var(--ok);border-color:var(--ok);color:#fff}
.meta{font-size:13px;color:var(--mute);margin:2px 0 6px}
.card footer{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.due{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;color:var(--acc);white-space:nowrap}
.due svg{width:14px;height:14px}.due.over{color:var(--warn)}
.acts{margin-left:auto;display:flex;gap:2px}
.ib{width:40px;height:40px;border:0;background:none;border-radius:12px;display:grid;place-items:center;color:var(--mute)}
.ib:hover{background:var(--chip)}.ib.on{color:var(--acc)}
.empty{text-align:center;color:var(--mute);padding:36px 10px}
.empty h2{color:var(--ink);font-size:26px;line-height:1.1;margin:0 0 8px;text-wrap:balance}
.ex{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.ex button{border:1px dashed var(--line);background:var(--panel);border-radius:14px 14px 14px 4px;padding:8px 12px;font-size:14px;text-align:left}
/* composer */
.comp{border-top:1px solid var(--line);background:var(--panel);padding:10px max(4vw,14px) 12px}
.comp form{max-width:720px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
.comp textarea{flex:1;resize:none;border:1px solid var(--line);background:var(--bg);border-radius:22px;padding:10px 16px;font-size:16px;line-height:1.4;max-height:160px;min-height:44px;outline:0}
.comp textarea:focus{border-color:var(--acc)}
.round{width:44px;height:44px;border-radius:50%;border:0;display:grid;place-items:center;flex:none}
.send{background:var(--acc);color:#fff}
.mic{background:var(--chip)}.mic.on{background:var(--warn);color:#fff}
.hint{max-width:720px;margin:6px auto 0;font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* board */
.board{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:12px;align-items:flex-start}
.col{flex:0 0 min(300px,82vw);scroll-snap-align:start;background:var(--chip);border-radius:18px;padding:10px}
.col>h2{font-size:15px;margin:2px 4px 10px;display:flex;justify-content:space-between;align-items:center}
.col>h2 button{border:0;background:none;color:var(--acc);font-weight:700;min-height:36px}
.col .list{gap:8px}
/* calendar */
.calhead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.calhead h2{font-size:26px;margin:0;flex:1;letter-spacing:-.01em}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{font-size:12px;color:var(--mute);text-align:center;font-weight:700}
.day{aspect-ratio:1/0.9;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:5px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;font-weight:600;font-size:14px}
.day.out{opacity:.35}.day.today{border-color:var(--acc);color:var(--acc)}.day.sel{background:var(--ink);color:var(--bg)}
.dots{display:flex;gap:3px;flex-wrap:wrap}.dots i{width:7px;height:7px;border-radius:50%;background:var(--acc)}.dots i.d{background:var(--warn)}
.legend{font-size:13px;color:var(--mute);display:flex;gap:14px;margin:8px 0 16px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--acc);margin-right:5px}.legend i.d{background:var(--warn)}
/* swipe */
.deck{max-width:460px;margin:0 auto;text-align:center}
.deck .count{color:var(--mute);font-size:14px;margin:0 0 10px}
.stage{position:relative;min-height:300px;display:grid;place-items:center}
.stage .card{width:100%;text-align:left;touch-action:pan-y;user-select:none;font-size:18px;min-height:240px;display:flex;flex-direction:column;cursor:grab}
.stage .card .txt{font-size:20px;flex:1}
.stage .lab{position:absolute;top:14px;font-weight:800;font-size:18px;opacity:0;padding:4px 10px;border-radius:8px;border:3px solid}
.lab.l{left:14px;color:var(--warn)}.lab.r{right:14px;color:var(--ok)}
.swbtns{display:flex;justify-content:center;gap:12px;margin-top:16px}
.swbtns button{min-height:48px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-weight:700;display:flex;gap:6px;align-items:center}
.swbtns .k{background:var(--acc);border-color:var(--acc);color:#fff}
/* prefs */
.sec{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:14px}
.sec h2{font-size:18px;margin:0 0 4px}.sec p{margin:0 0 10px;color:var(--mute);font-size:15px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--chip);font-weight:600}
.btn.p{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn.d{color:var(--warn)}
.sw{width:40px;height:40px;border-radius:50%;border:3px solid transparent}.sw.on{border-color:var(--ink)}
.trig{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 44px;gap:6px;align-items:center;margin-bottom:6px}
.trig input,.fld input,.fld textarea,.fld select{width:100%;min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:8px 12px;font-size:16px}
.cheat{display:grid;gap:6px;font-size:15px}.cheat code{background:var(--chip);padding:2px 6px;border-radius:6px;overflow-wrap:anywhere}
/* dialog + toast */
dialog{border:0;border-radius:22px;padding:0;background:var(--panel);color:var(--ink);width:min(560px,94vw);box-shadow:0 20px 60px #0006}
dialog::backdrop{background:#0008}
dialog form{padding:18px;display:grid;gap:12px}
dialog h2{margin:0;font-size:20px}
.fld label{display:block;font-size:13px;font-weight:700;color:var(--mute);margin-bottom:4px}
.fld textarea{min-height:130px;resize:vertical}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:999px;padding:10px 8px 10px 18px;display:flex;gap:12px;align-items:center;font-weight:600;font-size:15px;z-index:9;max-width:92vw}
.toast button{background:none;border:0;color:var(--acc);font-weight:800;min-height:32px;padding:0 10px}
.toast[hidden]{display:none}
@keyframes pop{from{transform:translateY(6px);opacity:0}}
@media(prefers-reduced-motion:reduce){.card{animation:none}}
@media(max-width:600px){.logo{font-size:19px}.day{font-size:12px;padding:3px}.dots i{width:5px;height:5px}.calhead h2{font-size:21px}}
</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>

</svg>
<div class="top"><div class="logo"><b><svg class="i"><use href="#i-send"/></svg></b>ThoughtDrop</div><div class="sync" id="sync"><i></i><span>This device</span></div></div>
<nav class="tabs" id="tabs"><a href="#feed">Feed</a><a href="#board">Board</a><a href="#calendar">Calendar</a><a href="#swipe">Swipe</a><a href="#prefs">Settings</a></nav>
<main id="main"><div class="wrap" id="view"></div></main>
<div class="comp"><form id="cf"><button type="button" class="round mic" id="mic" hidden aria-label="Dictate"><svg class="i"><use href="#i-mic"/></svg></button><textarea id="inp" rows="1" placeholder="Text yourself anything…" aria-label="New note"></textarea><button class="round send" aria-label="Send"><svg class="i"><use href="#i-send"/></svg></button></form>
<div class="hint">Try <b>remind me tomorrow at 9am to call the shop</b> · <b>groceries: eggs, milk</b> · <b>todo</b> · <b>#tags</b></div></div>
<dialog id="dlg"><form id="ef" method="dialog"><h2>Edit</h2>
<div class="fld"><label for="eKind">Type</label><select id="eKind"><option value="note">Note</option><option value="task">Task</option><option value="list">List</option><option value="reminder">Reminder</option></select></div>
<div class="fld"><label for="eText">Text <span id="eHint"></span></label><textarea id="eText"></textarea></div>
<div class="fld"><label for="eTags">Tags (space separated)</label><input id="eTags" autocomplete="off"></div>
<div class="fld"><label for="eDue">Due / remind at</label><input id="eDue" type="datetime-local"></div>
<div class="row"><button type="button" class="btn d" id="eDel">Delete</button><span style="flex:1"></span><button type="button" class="btn" id="eCancel">Cancel</button><button class="btn p" id="eSave">Save</button></div>
</form></dialog>
<div class="toast" id="toast" hidden role="status"><span id="tmsg"></span><button id="tundo" hidden>Undo</button></div>
<script>
{
const $=s=>document.querySelector(s), view=$('#view'), inp=$('#inp');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const linkify=s=>esc(s).replace(/https:\/\/[^\s<]+/g,u=>`<a href="${u}" target="_blank" rel="noopener">${u.length>48?u.slice(0,45)+'…':u}</a>`);
const I=n=>`<svg class="i"><use href="#i-${n}"/></svg>`;
const KI={note:'note',list:'list',task:'task',reminder:'bell'}, KL={note:'Note',list:'List',task:'Task',reminder:'Reminder'};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const clone=o=>JSON.parse(JSON.stringify(o));
const DEF={accent:'#ff5a36',triggers:{idea:'ideas',buy:'shopping',grocery:'shopping',groceries:'shopping',call:'calls',read:'reading',watch:'watchlist',work:'work'}};

/* ---------- storage: this device, plus cloud sync when available ---------- */
const LS='thoughtdrop.v1';
let notes=new Map(), settings=clone(DEF), tomb={}, subs={}, col=null, dl=null, dict=null, listening=false;
try{const o=JSON.parse(localStorage.getItem(LS)||'{}');(o.notes||[]).forEach(n=>n&&n.id&&notes.set(n.id,n));if(o.settings)settings={...settings,...o.settings};if(o.tomb)tomb=o.tomb;if(o.subs)subs=o.subs}catch(e){}
const lsSave=()=>{try{localStorage.setItem(LS,JSON.stringify({notes:[...notes.values()],settings,tomb,subs}))}catch(e){}};
function cleanNote(x){if(!x||typeof x.id!=='string'||!/^[\w-]{1,64}$/.test(x.id))return null;const n={id:x.id,kind:['note','list','task','reminder'].includes(x.kind)?x.kind:'note',text:String(x.text||''),tags:Array.isArray(x.tags)?x.tags.map(t=>String(t).slice(0,40)):[],created:+x.created||Date.now(),updated:+x.updated||+x.created||Date.now(),due:typeof x.due==='string'&&!isNaN(Date.parse(x.due))?x.due:null,done:!!x.done,pinned:!!x.pinned,archived:!!x.archived,reviewed:!!x.reviewed,notified:!!x.notified};if(x.kind==='list'){n.title=String(x.title||'List');n.items=Array.isArray(x.items)?x.items.map(i=>({t:String(i&&i.t||''),d:!!(i&&i.d)})):[]}return n}

/* ---------- GitHub Gist sync ---------- */
const GK='thoughtdrop.gist',FN='thoughtdrop.json';let gist={token:'',id:'',last:0};
try{gist={...gist,...JSON.parse(localStorage.getItem(GK)||'{}')}}catch(e){}
const gSave=()=>{try{localStorage.setItem(GK,JSON.stringify(gist))}catch(e){}};
async function gh(path,opt={}){const r=await fetch('https://api.github.com'+path,{...opt,cache:'no-store',headers:{Authorization:'Bearer '+gist.token,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...(opt.body?{'Content-Type':'application/json'}:{})}});if(!r.ok){const e=new Error('HTTP '+r.status);e.status=r.status;throw e}return r.status===204?null:r.json()}
async function findGist(){for(let p=1;p<=10;p++){const l=await gh('/gists?per_page=100&page='+p);const g=l.find(g=>g.files&&g.files[FN]);if(g)return g.id;if(l.length<100)break}return''}
async function readRemote(){const g=await gh('/gists/'+gist.id);const f=g.files&&g.files[FN];if(!f)return null;let t=f.content;if(f.truncated){const r=await fetch(f.raw_url,{cache:'no-store'});t=await r.text()}try{return JSON.parse(t)}catch(e){return null}}
const canon=o=>JSON.stringify({n:[...(o.notes||[])].sort((a,b)=>a.id<b.id?-1:1),t:Object.keys(o.tomb||{}).sort().map(k=>[k,o.tomb[k]]),s:o.settings||null,p:Object.keys(o.subs||{}).sort().map(k=>[k,o.subs[k]&&o.subs[k].added])});
function merge(r){
  if(!r)return false;let ch=false;
  for(const [id,ts] of Object.entries(r.tomb||{}))if(/^[\w-]{1,64}$/.test(id)&&+ts&&!(tomb[id]>=+ts))tomb[id]=+ts;
  (r.notes||[]).forEach(x=>{const n=cleanNote(x);if(!n||tomb[n.id]>=n.updated)return;const l=notes.get(n.id);if(!l||n.updated>(l.updated||0)){notes.set(n.id,n);ch=true}});
  for(const [id,n] of [...notes])if(tomb[id]>=(n.updated||n.created||0)){notes.delete(id);ch=true}
  for(const [k,v] of Object.entries(r.subs||{}))if(/^[\w-]{1,40}$/.test(k)&&v&&v.sub&&typeof v.sub.endpoint==='string'&&v.sub.endpoint.startsWith('https://')&&!(tomb['sub-'+k]>=(+v.added||0))&&(!subs[k]||(+v.added||0)>(+subs[k].added||0))){subs[k]={sub:v.sub,added:+v.added||0,name:String(v.name||'').slice(0,40)};ch=true}
  for(const k of Object.keys(subs))if(tomb['sub-'+k]>=(+subs[k].added||0)){delete subs[k];ch=true}
  const old=Date.now()-60*864e5;for(const k in tomb)if(tomb[k]<old)delete tomb[k];
  if(r.settings&&(+r.settings.updated||0)>(+settings.updated||0)){settings={...clone(DEF),...r.settings,triggers:typeof r.settings.triggers==='object'&&r.settings.triggers?r.settings.triggers:DEF.triggers};ch=true}
  return ch;
}
let gBusy=false,gAgain=false,gT=null;
async function gsync(){
  if(!gist.token)return;if(gBusy){gAgain=true;return}gBusy=true;setSync('connecting');
  try{
    if(!gist.id){gist.id=await findGist();gSave()}
    let remote=null;if(gist.id){try{remote=await readRemote()}catch(e){if(e.status===404){gist.id='';gSave()}else throw e}}
    const ch=merge(remote),local={app:'thoughtdrop',v:1,notes:[...notes.values()],tomb,settings,subs},body=JSON.stringify(local);
    if(!gist.id){const g=await gh('/gists',{method:'POST',body:JSON.stringify({description:'ThoughtDrop notes — synced by the app, do not delete',public:false,files:{[FN]:{content:body}}})});gist.id=g.id}
    else if(!remote||canon(remote)!==canon(local))await gh('/gists/'+gist.id,{method:'PATCH',body:JSON.stringify({files:{[FN]:{content:body}}})});

/* ---------- parsing: what you text becomes a card ---------- */
const DAYS=['sun','mon','tue','wed','thu','fri','sat'];
function parseWhen(s,now=new Date()){
  const hits=[];let d=new Date(now),date=false,time=false,m;const low=s.toLowerCase();
  const take=re=>{const r=low.match(re);if(r)hits.push(r[0]);return r};
  if(m=take(/\bin (\d+|an?|one) (min(?:ute)?s?|hours?|hrs?|days?|weeks?)\b/)){
    const k=/^\d+$/.test(m[1])?+m[1]:1,u=m[2][0];
    if(u==='m')d=new Date(+now+k*6e4);else if(u==='h')d=new Date(+now+k*36e5);else d.setDate(d.getDate()+k*(u==='w'?7:1));
    return{date:d,hits,exact:u==='m'||u==='h'};
  }
  if(take(/\btomorrow\b/)){d.setDate(d.getDate()+1);date=true}
  else if(take(/\btoday\b/))date=true;
  if(take(/\btonight\b/)){date=true;if(!/\d\s*(am|pm)|:\d/.test(low)){d.setHours(20,0,0,0);time=true}}
  if(!date&&(m=take(/\b(?:on |next |this )?(sun|mon|tue|wed|thu|fri|sat)[a-z]*\b/))){const t=DAYS.indexOf(m[1]);let add=(t-d.getDay()+7)%7;if(add===0)add=7;d.setDate(d.getDate()+add);date=true}
  if(!date&&(m=take(/\b(?:on )?(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/))){const y=m[3]?(+m[3]<100?2000+ +m[3]:+m[3]):d.getFullYear();d=new Date(y,+m[1]-1,+m[2],d.getHours(),d.getMinutes());if(!m[3]&&d<now&&d.toDateString()!==now.toDateString())d.setFullYear(y+1);date=true}
  if(m=take(/\b(?:at |@ ?)?(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/)){let h=+m[1]%12;if(m[3]==='pm')h+=12;d.setHours(h,+(m[2]||0),0,0);time=true}
  else if(m=take(/\bat (\d{1,2}):(\d{2})\b/)){d.setHours(+m[1],+m[2],0,0);time=true}
  else if(m=take(/\b(?:at )?(noon|midnight)\b/)){d.setHours(m[1]==='noon'?12:0,0,0,0);time=true}
  else if(m=take(/\b(?:in the |this )?(morning|afternoon|evening)\b/)){d.setHours({morning:9,afternoon:15,evening:18}[m[1]],0,0,0);time=true}
  if(!date&&!time)return null;
  if(!time)d.setHours(9,0,0,0);

}

function parse(raw){
  let text=raw.trim();const tags=new Set();
  text=text.replace(/(^|\s)#([\p{L}\p{N}_-]+)/gu,(_,sp,t)=>{tags.add(t.toLowerCase());return sp}).trim();
  const low=text.toLowerCase();
  for(const [w,t] of Object.entries(settings.triggers||{}))if(w&&t&&new RegExp('\\b'+w.replace(/[^\w]/g,'')+'\\b','i').test(low))tags.add(t.toLowerCase());
  const n={id:uid(),kind:'note',text,tags:[...tags],created:Date.now(),done:false,pinned:false,archived:false,reviewed:false,due:null};
  let m;
  if(m=text.match(/^remind(?:\s+me)?\b[\s,:]*(.*)$/is)){
    const w=parseWhen(m[1]);n.kind='reminder';
    let body=w?strip(m[1],w.hits):m[1];body=body.replace(/^(to|about|that)\s+/i,'').replace(/\s+(to|on|at)$/i,'').trim();
    n.text=body||m[1];n.due=w?w.date.toISOString():null;tags.add('reminders');n.tags=[...tags];
  }else if((m=text.match(/^([\p{L} ]{1,24}):\s*([\s\S]+)$/u),m&&/,|\n/.test(m[2]))||/^list\b/i.test(text)){
    const hm=m&&/,|\n/.test(m[2]),head=hm?m[1]:'List',rest=hm?m[2]:text.replace(/^list\b[:\s-]*/i,'');
    n.kind='list';n.title=head.trim().replace(/^\w/,c=>c.toUpperCase());
    n.items=rest.split(/\n|,/).map(x=>x.replace(/^\s*[-*•]\s*/,'').trim()).filter(Boolean).map(t=>({t,d:false}));n.text='';
  }else if(text.split('\n').filter(l=>/^\s*[-*•]\s+/.test(l)).length>=2){
    const ls=text.split('\n');n.kind='list';n.title=/^\s*[-*•]/.test(ls[0])?'List':ls.shift().trim();
    n.items=ls.map(x=>x.replace(/^\s*[-*•]\s*/,'').trim()).filter(Boolean).map(t=>({t,d:false}));n.text='';
  }else if(m=text.match(/^(todo|to-do|task|do)\b[:\s-]+([\s\S]+)$/i)){

${!vapidPub()?`<p><b>Step 1, one time only:</b> create the push key pair. Do this on one device; the others pick it up through Gist sync.</p><div class="row"><button class="btn p" data-a="mkkey">Create push key</button></div>`:''}
${subs[DEV]?`<p><b>On for this device.</b> Devices getting pushes: ${Object.values(subs).map(v=>esc(v.name||'Device')).join(', ')}.</p><div class="row"><button class="btn" data-a="ptest">Send a test</button><button class="btn d" data-a="poff">Turn off here</button></div>`
:`${isIOS&&!standalone?'<p>On iPhone: tap Share → <b>Add to Home Screen</b>, open ThoughtDrop from the new icon, then turn this on there.</p>':''}${gist.token?'':'<p>Connect Gist sync above first.</p>'}${vapidPub()?'<div class="row"><button class="btn p" data-a="pon">Turn on push notifications</button></div>':''}`}
<p style="margin-top:10px">With the app open, alerts are on time. With it closed, GitHub checks every 5 minutes, so a push can land a few minutes late.</p></section>
<section class="sec"><h2>Export &amp; import</h2><p>${notes.size} notes stored.</p><div class="row"><button class="btn" data-a="csv">Export CSV</button><button class="btn" data-a="json">Export backup (JSON)</button><label class="btn" style="display:flex;align-items:center">Import backup<input type="file" accept=".json,application/json" id="imp" hidden></label></div></section>
<section class="sec"><h2>Clean up</h2><div class="row"><button class="btn d" data-a="purge">Delete all archived (${[...notes.values()].filter(n=>n.archived).length})</button></div></section>`;
  $('#imp').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const o=JSON.parse(await f.text());let k=0;(Array.isArray(o)?o:o.notes||[]).forEach(x=>{const n=cleanNote(x);if(n){n.updated=Date.now();delete tomb[n.id];notes.set(n.id,n);push(n.id);k++}});lsSave();queueSync();render();toast(`Imported ${k} notes`)}catch(err){toast('That file isn’t a ThoughtDrop backup')}};
}
const VIEWS={feed:vFeed,board:vBoard,calendar:vCal,swipe:vSwipe,prefs:vPrefs};
function route(){const h=location.hash.slice(1);return VIEWS[h]?h:'feed'}
function render(){const r=route();document.querySelectorAll('#tabs a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+r));const sy=$('#main').scrollTop;VIEWS[r]();$('#main').scrollTop=sy}
function applyAccent(){document.documentElement.style.setProperty('--acc',/^#[0-9a-f]{6}$/i.test(settings.accent)?settings.accent:DEF.accent)}

/* ---------- push notifications ---------- */
const vapidPub=()=>settings.vapid&&typeof settings.vapid.pub==='string'?settings.vapid.pub:'';
let DEV='';try{DEV=localStorage.getItem('thoughtdrop.dev')||'';if(!DEV){DEV='d'+uid();localStorage.setItem('thoughtdrop.dev',DEV)}}catch(e){DEV='d'+uid()}
const pushCapable=()=>location.hostname.endsWith('github.io')&&'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;
const isIOS=/iP(hone|ad|od)/.test(navigator.userAgent),standalone=!!((window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone);
const b64u=s=>{const p='='.repeat((4-s.length%4)%4),b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(b,c=>c.charCodeAt(0))};
function devName(){const u=navigator.userAgent;return /iPhone/.test(u)?'iPhone':/iPad/.test(u)?'iPad':/Android/.test(u)?'Android':/Mac/.test(u)?'Mac':/Windows/.test(u)?'Windows PC':'Browser'}
async function pushOn(){
  if(!pushCapable())return toast(isIOS&&!standalone?'On iPhone, add ThoughtDrop to your Home Screen first, then open it from there':'Push isn’t supported in this browser');
  if(!gist.token)return toast('Connect Gist sync first — it carries your reminders to the push sender');
  if(!vapidPub())return toast('Create the push key first (step 1)');
  try{
    const perm=await Notification.requestPermission();if(perm!=='granted')return toast('Notifications were blocked — allow them in your browser settings');
    const reg=await navigator.serviceWorker.ready;let sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(vapidPub())});
    delete tomb['sub-'+DEV];subs[DEV]={sub:sub.toJSON(),added:Date.now(),name:devName()};lsSave();await gsync();render();toast('Push notifications on for this device');
  }catch(e){toast('Couldn’t turn on push: '+(e&&e.message||'unknown error'))}
}
let newPriv='';
async function makeKey(){try{const k=await crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign']);
  const raw=new Uint8Array(await crypto.subtle.exportKey('raw',k.publicKey)),jwk=await crypto.subtle.exportKey('jwk',k.privateKey);
  const pub=btoa(String.fromCharCode(...raw)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  newPriv=jwk.d;settings.vapid={pub};saveSettings();render();}catch(e){toast('This browser can’t create keys')}}
async function pushOff(){try{const reg=await navigator.serviceWorker.ready,sub=await reg.pushManager.getSubscription();if(sub)await sub.unsubscribe()}catch(e){}delete subs[DEV];tomb['sub-'+DEV]=Date.now();lsSave();queueSync();render();toast('Push notifications off for this device')}
async function localAlert(n){try{if(Notification.permission!=='granted')return false;const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();const body=n.kind==='list'?n.title:n.text;if(reg)await reg.showNotification('ThoughtDrop',{body,tag:n.id,icon:'icon-192.png',badge:'icon-192.png',data:{url:'./#feed'}});else new Notification('ThoughtDrop',{body,tag:n.id});return true}catch(e){return false}}

/* ---------- toast ---------- */
let tt=null;
function toast(msg,undo){const t=$('#toast'),u=$('#tundo');$('#tmsg').textContent=msg;u.hidden=!undo;u.onclick=()=>{undo&&undo();t.hidden=true};t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,undo?5000:2200)}

/* ---------- composer ---------- */
const grow=()=>{inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,160)+'px'};
inp.oninput=grow;
inp.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();$('#cf').requestSubmit()}};
$('#cf').onsubmit=e=>{e.preventDefault();const v=inp.value.trim();if(!v)return;const n=parse(v);put(n,`Saved as ${KL[n.kind].toLowerCase()}${n.due?' · '+fmtDue(new Date(n.due)):''}${n.tags.length?' · #'+n.tags.join(' #'):''}`);inp.value='';grow();if(route()!=='feed'&&route()!=='board')location.hash='feed'};
function setupDictation(){const mic=$('#mic'),PH=inp.placeholder;mic.hidden=false;
  dict.onFinal(({text})=>{inp.value=(inp.value+' '+text).trim();grow()});
  dict.onPartial(({text})=>{inp.placeholder=text||'Listening…'});
  dict.onState(({state})=>{listening=state==='listening';mic.classList.toggle('on',listening);if(!listening)inp.placeholder=PH});
  mic.onclick=()=>{if(listening){dict.stop().catch(()=>{});return}dict.start().catch(e=>{if(e&&e.code==='not_granted')mic.hidden=true})}}

/* ---------- editor ---------- */
let editing=null;const dlg=$('#dlg');
function openEdit(id){const n=notes.get(id);if(!n)return;editing=id;$('#eKind').value=n.kind;
  $('#eText').value=n.kind==='list'?[n.title||'List',...(n.items||[]).map(i=>(i.d?'x ':'- ')+i.t)].join('\n'):n.text;
  $('#eHint').textContent=n.kind==='list'?'(first line = title, one item per line, “x ” = done)':'';
  $('#eTags').value=(n.tags||[]).join(' ');
  const d=n.due?new Date(n.due):null;$('#eDue').value=d?new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,16):'';
  try{dlg.showModal()}catch(e){dlg.setAttribute('open','')}}
$('#eKind').onchange=()=>{$('#eHint').textContent=$('#eKind').value==='list'?'(first line = title, one item per line, “x ” = done)':''};
$('#ef').onsubmit=e=>{e.preventDefault();const o=notes.get(editing);if(!o)return dlg.close();const n=clone(o),k=$('#eKind').value,txt=$('#eText').value.trim();
  n.kind=k;if(k==='list'){const ls=txt.split('\n').map(s=>s.trim()).filter(Boolean);n.title=(ls.shift()||'List');n.items=ls.map(l=>({d:/^x\s/i.test(l),t:l.replace(/^(x|-|\*|•)\s+/i,'')}));n.text=''}
  else{n.text=txt||(o.kind==='list'?[o.title,...(o.items||[]).map(i=>i.t)].join('\n'):'');delete n.items;delete n.title}
  n.tags=[...new Set($('#eTags').value.split(/[\s,]+/).map(t=>t.replace(/^#/,'').toLowerCase()).filter(Boolean))];
  const dv=$('#eDue').value;n.due=dv?new Date(dv).toISOString():null;if(n.due!==o.due)n.notified=false;
  put(n,'Saved');dlg.close()};
$('#eCancel').onclick=()=>dlg.close();
$('#eDel').onclick=()=>{const o=clone(notes.get(editing));dlg.close();if(!o)return;del(o.id);toast('Deleted',()=>put(o))};

/* ---------- clicks ---------- */
document.addEventListener('click',e=>{
  const t=e.target;let b;
  if(b=t.closest('[data-ex]')){inp.value=b.dataset.ex;grow();inp.focus();return}
  if(b=t.closest('[data-f]')){st.f=b.dataset.f;render();return}
  if(b=t.closest('[data-tag]')){const tg=b.dataset.tag;st.tag=st.tag===tg?'':tg;if(route()!=='feed')location.hash='feed';else render();return}
  if(b=t.closest('[data-add]')){inp.value='#'+b.dataset.add+' ';grow();inp.focus();return}
  if(b=t.closest('[data-cal]')){const v=+b.dataset.cal;if(v===0){st.cal=new Date();st.sel=new Date()}else st.cal=new Date(st.cal.getFullYear(),st.cal.getMonth()+v,1);render();return}
  if(b=t.closest('[data-day]')){st.sel=new Date(+b.dataset.day);render();return}
  if(b=t.closest('[data-sw]')){swipe(b.dataset.sw);return}
  if(b=t.closest('[data-acc]')){settings.accent=b.dataset.acc;saveSettings();render();return}
  if(!(b=t.closest('[data-a]')))return;
  const a=b.dataset.a,cEl=b.closest('[data-id]'),id=cEl&&cEl.dataset.id,o=id&&notes.get(id);
  if(o){const n=clone(o),prev=clone(o);
    if(a==='edit')return openEdit(id);
    if(a==='item'){const it=n.items[+b.dataset.i];if(it){it.d=!it.d;put(n)}return}
    if(a==='done'){n.done=!n.done;put(n);toast(n.done?'Marked done':'Reopened',()=>put(prev));return}
    if(a==='pin'){n.pinned=!n.pinned;put(n);return}
    if(a==='arch'){n.archived=!n.archived;put(n);toast(n.archived?'Archived':'Restored',()=>put(prev));return}
  }
  if(a==='reshuffle'){[...notes.values()].filter(n=>n.reviewed&&isOpen(n)).forEach(n=>{const c=clone(n);c.reviewed=false;c.updated=Date.now();notes.set(c.id,c);push(c.id)});lsSave();queueSync();render()}
  if(a==='gin'){const v=$('#gtok').value.trim();if(!/^(ghp_|github_pat_|gho_)?[\w]{20,}$/.test(v))return toast('That doesn’t look like a GitHub token');gist={token:v,id:'',last:0};gSave();render();gsync()}
  if(a==='gsync')gsync();
  if(a==='gout'){gist={token:'',id:'',last:0};gSave();setSync(col?'synced':'local');render();toast('This device stopped syncing; notes stay here')}
  if(a==='addtrig'){$('#trigs').insertAdjacentHTML('beforeend',`<div class="trig"><input data-tw placeholder="word" aria-label="Word"><input data-tt placeholder="tag" aria-label="Tag"><button class="ib" data-a="rmtrig" aria-label="Remove">${I('x')}</button></div>`)}
  if(a==='rmtrig'){b.closest('.trig').remove()}
  if(a==='savetrig'){const tr={};document.querySelectorAll('.trig').forEach(r=>{const w=r.querySelector('[data-tw]').value.trim().toLowerCase().replace(/[^\p{L}\p{N}_-]/gu,''),tg=r.querySelector('[data-tt]').value.trim().toLowerCase().replace(/^#/,'').replace(/[^\p{L}\p{N}_-]/gu,'');if(w&&tg)tr[w]=tg});settings.triggers=tr;saveSettings();render();toast('Trigger words saved')}
  if(a==='csv'||a==='json'){const arr=[...notes.values()].sort((x,y)=>x.created-y.created);let data,fn;
    if(a==='csv'){const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';data='created,type,text,tags,due,done,archived\n'+arr.map(n=>[new Date(n.created).toISOString(),n.kind,n.kind==='list'?[n.title,...(n.items||[]).map(i=>(i.d?'[x] ':'[ ] ')+i.t)].join('\n'):n.text,(n.tags||[]).join(' '),n.due||'',n.done,n.archived].map(q).join(',')).join('\n');fn='thoughtdrop.csv'}
    else{data=JSON.stringify({notes:arr},null,1);fn='thoughtdrop-backup.json'}
    if(dl)dl.save({filename:fn,data}).catch(()=>toast('Download cancelled'));
    else if(navigator.clipboard)navigator.clipboard.writeText(data).then(()=>toast('Copied to clipboard — paste it into a file'),()=>toast('Couldn’t export here'));
  }
  if(a==='pon')pushOn();
  if(a==='mkkey')makeKey();
  if(a==='cpk'){const v=$('#privk').value;navigator.clipboard?navigator.clipboard.writeText(v).then(()=>toast('Copied'),()=>{$('#privk').select();toast('Select and copy it manually')}):$('#privk').select()}
  if(a==='donek'){newPriv='';render()}
  if(a==='poff')pushOff();
  if(a==='ptest')localAlert({id:'test',kind:'note',text:'Test notification — you’re all set.'}).then(ok=>toast(ok?'Sent':'Notifications are blocked here'));
  if(a==='purge'){const ar=[...notes.values()].filter(n=>n.archived).map(clone);if(!ar.length)return;ar.forEach(n=>{notes.delete(n.id);tomb[n.id]=Date.now();push(n.id)});lsSave();queueSync();render();toast(`Deleted ${ar.length}`,()=>ar.forEach(n=>put(n)))}
});
addEventListener('hashchange',render);

/* ---------- due checks ---------- */
const fired=new Set();
const dueTick=()=>{let any=false;notes.forEach(n=>{if(overdue(n)&&!fired.has(n.id)){fired.add(n.id);any=true;if(!n.notified)localAlert(n).then(ok=>{if(ok){const c=clone(notes.get(n.id)||n);c.notified=true;c.updated=Date.now();notes.set(c.id,c);lsSave();push(c.id);queueSync()}})}});if(any&&!dlg.open&&document.activeElement!==$('#q'))render()};setInterval(dueTick,20000);
notes.forEach(n=>{if(overdue(n)&&n.notified)fired.add(n.id)});

applyAccent();render();initCloud();gsync();setInterval(()=>{if(!document.hidden)gsync()},60000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)gsync()});
if(location.hostname.endsWith("github.io")&&"serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
}
</script></body></html>

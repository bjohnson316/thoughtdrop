<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ThoughtDrop</title>
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-180.png"><meta name="theme-color" content="#ff5a36"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ThoughtDrop">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: quick, private, like texting yourself at 2am
   IDEA: a message thread with your own brain; every text becomes a sorted card
   PICTURE: the live feed and the send bubble are the picture
   COLOUR+TYPE: white or ink ground, one hot "sent" accent, Figtree throughout
   LAYOUT: app bar + view tabs, content column, composer pinned to the bottom */
:root{color-scheme:light dark;--bg:light-dark(#f6f7f9,#0f1014);--panel:light-dark(#fff,#191b21);--ink:light-dark(#15161b,#eceef3);--mute:light-dark(#646977,#9ba0ad);--line:light-dark(#e3e5ea,#2a2d36);--chip:light-dark(#eef0f4,#24272f);--acc:#ff5a36;--warn:light-dark(#c62828,#ff7b72);--ok:light-dark(#17804a,#4ad08a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif;overflow-x:clip;display:flex;flex-direction:column}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.top{display:flex;align-items:center;gap:12px;padding:12px max(4vw,14px) 0;max-width:1100px;width:100%;margin:0 auto}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;letter-spacing:-.02em}
.logo b{width:34px;height:34px;border-radius:12px 12px 12px 4px;background:var(--acc);display:grid;place-items:center;color:#fff}
.sync{margin-left:auto;font-size:13px;color:var(--mute);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--mute)}.sync.ok i{background:var(--ok)}.sync.bad i{background:var(--warn)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding:10px max(4vw,14px);max-width:1100px;width:100%;margin:0 auto;scrollbar-width:none}
nav.tabs a{flex:none;text-decoration:none;color:var(--mute);font-weight:600;padding:9px 14px;border-radius:999px;min-height:40px;display:flex;align-items:center}
nav.tabs a.on{background:var(--ink);color:var(--bg)}
main{flex:1;overflow-y:auto;width:100%}
.wrap{max-width:1100px;margin:0 auto;padding:4px max(4vw,14px) 24px}
.feedwrap{max-width:720px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.search{flex:1 1 220px;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:0 12px;min-height:44px}
.search input{border:0;background:none;outline:0;flex:1;font-size:16px;min-height:42px}
.seg{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.seg button,.tag{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;min-height:36px;color:var(--mute)}
.seg button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tag{min-height:28px;padding:2px 10px;font-size:13px;background:var(--chip);border-color:transparent;color:var(--ink)}
.tag.on{background:var(--acc);color:#fff}
.banner{border:2px solid var(--warn);border-radius:18px;padding:10px 12px 4px;margin-bottom:14px}
.banner h2{font-size:15px;margin:0 0 6px;color:var(--warn);display:flex;gap:6px;align-items:center}
.list{display:grid;gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 18px 6px;padding:12px 14px 10px;box-shadow:0 1px 0 var(--line);animation:pop .25s ease-out}
.card.pin{border-color:var(--acc)}
.card.isdone{opacity:.62}
.card header{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute)}
.card header .kind{display:flex;align-items:center;gap:5px;font-weight:600}
.card header .kind svg{width:15px;height:15px}
.card header time{margin-left:auto}
.pinmark{color:var(--acc);display:flex}.pinmark svg{width:15px;height:15px}
.card h3{margin:6px 0 4px;font-size:17px}
.txt{margin:6px 0 8px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:16.5px}
.card a{color:var(--acc);overflow-wrap:anywhere}
.struck{text-decoration:line-through;color:var(--mute)}
.items{list-style:none;margin:4px 0;padding:0}
.items li{display:flex;align-items:center;gap:8px;padding:2px 0;overflow-wrap:anywhere}
.tick{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:none;display:grid;place-items:center;flex:none;color:transparent;padding:0}
.tick svg{width:16px;height:16px}.tick.on{background:var(--ok);border-color:var(--ok);color:#fff}
.meta{font-size:13px;color:var(--mute);margin:2px 0 6px}
.card footer{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.due{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;color:var(--acc);white-space:nowrap}
.due svg{width:14px;height:14px}.due.over{color:var(--warn)}
.acts{margin-left:auto;display:flex;gap:2px}
.ib{width:40px;height:40px;border:0;background:none;border-radius:12px;display:grid;place-items:center;color:var(--mute)}
.ib:hover{background:var(--chip)}.ib.on{color:var(--acc)}
.empty{text-align:center;color:var(--mute);padding:36px 10px}
.empty h2{color:var(--ink);font-size:26px;line-height:1.1;margin:0 0 8px;text-wrap:balance}
.ex{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.ex button{border:1px dashed var(--line);background:var(--panel);border-radius:14px 14px 14px 4px;padding:8px 12px;font-size:14px;text-align:left}
/* composer */
.comp{border-top:1px solid var(--line);background:var(--panel);padding:10px max(4vw,14px) 12px}
.comp form{max-width:720px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
.comp textarea{flex:1;resize:none;border:1px solid var(--line);background:var(--bg);border-radius:22px;padding:10px 16px;font-size:16px;line-height:1.4;max-height:160px;min-height:44px;outline:0}
.comp textarea:focus{border-color:var(--acc)}
.round{width:44px;height:44px;border-radius:50%;border:0;display:grid;place-items:center;flex:none}
.send{background:var(--acc);color:#fff}
.mic{background:var(--chip)}.mic.on{background:var(--warn);color:#fff}
.hint{max-width:720px;margin:6px auto 0;font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* board */
.board{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:12px;align-items:flex-start}
.col{flex:0 0 min(300px,82vw);scroll-snap-align:start;background:var(--chip);border-radius:18px;padding:10px}
.col>h2{font-size:15px;margin:2px 4px 10px;display:flex;justify-content:space-between;align-items:center}
.col>h2 button{border:0;background:none;color:var(--acc);font-weight:700;min-height:36px}
.col .list{gap:8px}
/* calendar */
.calhead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.calhead h2{font-size:26px;margin:0;flex:1;letter-spacing:-.01em}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{font-size:12px;color:var(--mute);text-align:center;font-weight:700}
.day{aspect-ratio:1/0.9;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:5px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;font-weight:600;font-size:14px}
.day.out{opacity:.35}.day.today{border-color:var(--acc);color:var(--acc)}.day.sel{background:var(--ink);color:var(--bg)}
.dots{display:flex;gap:3px;flex-wrap:wrap}.dots i{width:7px;height:7px;border-radius:50%;background:var(--acc)}.dots i.d{background:var(--warn)}
.legend{font-size:13px;color:var(--mute);display:flex;gap:14px;margin:8px 0 16px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--acc);margin-right:5px}.legend i.d{background:var(--warn)}
/* swipe */
.deck{max-width:460px;margin:0 auto;text-align:center}
.deck .count{color:var(--mute);font-size:14px;margin:0 0 10px}
.stage{position:relative;min-height:300px;display:grid;place-items:center}
.stage .card{width:100%;text-align:left;touch-action:pan-y;user-select:none;font-size:18px;min-height:240px;display:flex;flex-direction:column;cursor:grab}
.stage .card .txt{font-size:20px;flex:1}
.stage .lab{position:absolute;top:14px;font-weight:800;font-size:18px;opacity:0;padding:4px 10px;border-radius:8px;border:3px solid}
.lab.l{left:14px;color:var(--warn)}.lab.r{right:14px;color:var(--ok)}
.swbtns{display:flex;justify-content:center;gap:12px;margin-top:16px}
.swbtns button{min-height:48px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-weight:700;display:flex;gap:6px;align-items:center}
.swbtns .k{background:var(--acc);border-color:var(--acc);color:#fff}
/* prefs */
.sec{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:14px}
.sec h2{font-size:18px;margin:0 0 4px}.sec p{margin:0 0 10px;color:var(--mute);font-size:15px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--chip);font-weight:600}
.btn.p{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn.d{color:var(--warn)}
.sw{width:40px;height:40px;border-radius:50%;border:3px solid transparent}.sw.on{border-color:var(--ink)}
.trig{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 44px;gap:6px;align-items:center;margin-bottom:6px}
.trig input,.fld input,.fld textarea,.fld select{width:100%;min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:8px 12px;font-size:16px}
.cheat{display:grid;gap:6px;font-size:15px}.cheat code{background:var(--chip);padding:2px 6px;border-radius:6px;overflow-wrap:anywhere}
/* dialog + toast */
dialog{border:0;border-radius:22px;padding:0;background:var(--panel);color:var(--ink);width:min(560px,94vw);box-shadow:0 20px 60px #0006}
dialog::backdrop{background:#0008}
dialog form{padding:18px;display:grid;gap:12px}
dialog h2{margin:0;font-size:20px}
.fld label{display:block;font-size:13px;font-weight:700;color:var(--mute);margin-bottom:4px}
.fld textarea{min-height:130px;resize:vertical}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:999px;padding:10px 8px 10px 18px;display:flex;gap:12px;align-items:center;font-weight:600;font-size:15px;z-index:9;max-width:92vw}
.toast button{background:none;border:0;color:var(--acc);font-weight:800;min-height:32px;padding:0 10px}
.toast[hidden]{display:none}
@keyframes pop{from{transform:translateY(6px);opacity:0}}
@media(prefers-reduced-motion:reduce){.card{animation:none}}
@media(max-width:600px){.logo{font-size:19px}.day{font-size:12px;padding:3px}.dots i{width:5px;height:5px}.calhead h2{font-size:21px}}
</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>

<symbol id="i-box" viewBox="0 0 24 24"><path d="M3 5h18v4H3zM5 9v10h14V9M10 13h4"/></symbol>
<symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4"/></symbol>

</svg>
<div class="top"><div class="logo"><b><svg class="i"><use href="#i-send"/></svg></b>ThoughtDrop</div><div class="sync" id="sync"><i></i><span>This device</span></div></div>
<nav class="tabs" id="tabs"><a href="#feed">Feed</a><a href="#board">Board</a><a href="#calendar">Calendar</a><a href="#swipe">Swipe</a><a href="#prefs">Settings</a></nav>
<main id="main"><div class="wrap" id="view"></div></main>
<div class="comp"><form id="cf"><button type="button" class="round mic" id="mic" hidden aria-label="Dictate"><svg class="i"><use href="#i-mic"/></svg></button><textarea id="inp" rows="1" placeholder="Text yourself anything…" aria-label="New note"></textarea><button class="round send" aria-label="Send"><svg class="i"><use href="#i-send"/></svg></button></form>
<div class="hint">Try <b>remind me tomorrow at 9am to call the shop</b> · <b>groceries: eggs, milk</b> · <b>todo</b> · <b>#tags</b></div></div>
<dialog id="dlg"><form id="ef" method="dialog"><h2>Edit</h2>
<div class="fld"><label for="eKind">Type</label><select id="eKind"><option value="note">Note</option><option value="task">Task</option><option value="list">List</option><option value="reminder">Reminder</option></select></div>
<div class="fld"><label for="eText">Text <span id="eHint"></span></label><textarea id="eText"></textarea></div>
<div class="fld"><label for="eTags">Tags (space separated)</label><input id="eTags" autocomplete="off"></div>
<div class="fld"><label for="eDue">Due / remind at</label><input id="eDue" type="datetime-local"></div>
<div class="row"><button type="button" class="btn d" id="eDel">Delete</button><span style="flex:1"></span><button type="button" class="btn" id="eCancel">Cancel</button><button class="btn p" id="eSave">Save</button></div>
</form></dialog>
<div class="toast" id="toast" hidden role="status"><span id="tmsg"></span><button id="tundo" hidden>Undo</button></div>
<script>
{
const $=s=>document.querySelector(s), view=$('#view'), inp=$('#inp');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const linkify=s=>esc(s).replace(/https:\/\/[^\s<]+/g,u=>`<a href="${u}" target="_blank" rel="noopener">${u.length>48?u.slice(0,45)+'…':u}</a>`);
const I=n=>`<svg class="i"><use href="#i-${n}"/></svg>`;
const KI={note:'note',list:'list',task:'task',reminder:'bell'}, KL={note:'Note',list:'List',task:'Task',reminder:'Reminder'};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const clone=o=>JSON.parse(JSON.stringify(o));
const DEF={accent:'#ff5a36',triggers:{idea:'ideas',buy:'shopping',grocery:'shopping',groceries:'shopping',call:'calls',read:'reading',watch:'watchlist',work:'work'}};

/* ---------- storage: this device, plus cloud sync when available ---------- */
const LS='thoughtdrop.v1';
let notes=new Map(), settings=clone(DEF), col=null, dl=null, dict=null, listening=false;
try{const o=JSON.parse(localStorage.getItem(LS)||'{}');(o.notes||[]).forEach(n=>n&&n.id&&notes.set(n.id,n));if(o.settings)settings={...settings,...o.settings}}catch(e){}
const lsSave=()=>{try{localStorage.setItem(LS,JSON.stringify({notes:[...notes.values()],settings}))}catch(e){}};
const writing=new Map();
async function push(id){
  if(!col)return;let w=writing.get(id);if(w&&w.busy){w.again=true;return}
  w={busy:true,again:false};writing.set(id,w);
  try{do{w.again=false;const n=id==='_settings'?settings:notes.get(id),ref=col.doc(id);if(n)await ref.set(clone(n));else await ref.delete()}while(w.again)}
  catch(e){toast(e&&e.code==='quota_exceeded'?'Cloud storage is full — delete old notes':'Couldn’t sync that change; it’s saved on this device')}
  finally{w.busy=false}
}
function put(n,msg){n.updated=Date.now();notes.set(n.id,n);lsSave();push(n.id);render();if(msg)toast(msg)}
function del(id){notes.delete(id);lsSave();push(id);render()}
function saveSettings(){lsSave();push('_settings');applyAccent()}
function setSync(s){const el=$('#sync');el.className='sync '+(s==='synced'?'ok':s==='offline'?'bad':'');el.lastChild.textContent={synced:'Synced',connecting:'Connecting…',offline:'Offline — saving here',local:'This device'}[s]}
async function initCloud(){
  if(!(window.claude&&claude.use))return;
  try{const d=await claude.use('downloads');dl=d}catch(e){}
  try{dict=await claude.use('dictation');if(dict)setupDictation()}catch(e){}
  setSync('connecting');
  try{
    const [d,u]=await Promise.all([claude.use('db'),claude.use('user')]);
    const id=u&&await u.id(); if(!d||!id)return setSync('local');
    col=d.collection('data/users/'+id);
    let first=true;const t=setTimeout(()=>setSync('offline'),10000);
    col.onSnapshot(snap=>{
      if(snap.metadata.fromCache&&snap.empty)return;
      if(!snap.metadata.fromCache){clearTimeout(t);setSync('synced')}
      if(first&&snap.empty){first=false;[...notes.keys()].forEach(push);push('_settings');return}
      first=false;const m=new Map();
      snap.docs.forEach(doc=>{const x=doc.data();if(!x)return;if(doc.id==='_settings')settings={...clone(DEF),...clone(x)};else if(x.id)m.set(doc.id,clone(x))});
      notes=m;lsSave();applyAccent();render();
    },()=>{clearTimeout(t);col=null;setSync('local')});
  }catch(e){setSync('local')}
}

/* ---------- parsing: what you text becomes a card ---------- */
const DAYS=['sun','mon','tue','wed','thu','fri','sat'];
function parseWhen(s,now=new Date()){
  const hits=[];let d=new Date(now),date=false,time=false,m;const low=s.toLowerCase();
  const take=re=>{const r=low.match(re);if(r)hits.push(r[0]);return r};
  if(m=take(/\bin (\d+|an?|one) (min(?:ute)?s?|hours?|hrs?|days?|weeks?)\b/)){
    const k=/^\d+$/.test(m[1])?+m[1]:1,u=m[2][0];
    if(u==='m')d=new Date(+now+k*6e4);else if(u==='h')d=new Date(+now+k*36e5);else d.setDate(d.getDate()+k*(u==='w'?7:1));
    return{date:d,hits,exact:u==='m'||u==='h'};
  }
  if(take(/\btomorrow\b/)){d.setDate(d.getDate()+1);date=true}
  else if(take(/\btoday\b/))date=true;
  if(take(/\btonight\b/)){date=true;if(!/\d\s*(am|pm)|:\d/.test(low)){d.setHours(20,0,0,0);time=true}}
  if(!date&&(m=take(/\b(?:on |next |this )?(sun|mon|tue|wed|thu|fri|sat)[a-z]*\b/))){const t=DAYS.indexOf(m[1]);let add=(t-d.getDay()+7)%7;if(add===0)add=7;d.setDate(d.getDate()+add);date=true}
  if(!date&&(m=take(/\b(?:on )?(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/))){const y=m[3]?(+m[3]<100?2000+ +m[3]:+m[3]):d.getFullYear();d=new Date(y,+m[1]-1,+m[2],d.getHours(),d.getMinutes());if(!m[3]&&d<now&&d.toDateString()!==now.toDateString())d.setFullYear(y+1);date=true}
  if(m=take(/\b(?:at |@ ?)?(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/)){let h=+m[1]%12;if(m[3]==='pm')h+=12;d.setHours(h,+(m[2]||0),0,0);time=true}
  else if(m=take(/\bat (\d{1,2}):(\d{2})\b/)){d.setHours(+m[1],+m[2],0,0);time=true}
  else if(m=take(/\b(?:at )?(noon|midnight)\b/)){d.setHours(m[1]==='noon'?12:0,0,0,0);time=true}
  else if(m=take(/\b(?:in the |this )?(morning|afternoon|evening)\b/)){d.setHours({morning:9,afternoon:15,evening:18}[m[1]],0,0,0);time=true}
  if(!date&&!time)return null;
  if(!time)d.setHours(9,0,0,0);

  if(a==='addtrig'){$('#trigs').insertAdjacentHTML('beforeend',`<div class="trig"><input data-tw placeholder="word" aria-label="Word"><input data-tt placeholder="tag" aria-label="Tag"><button class="ib" data-a="rmtrig" aria-label="Remove">${I('x')}</button></div>`)}
  if(a==='rmtrig'){b.closest('.trig').remove()}
  if(a==='savetrig'){const tr={};document.querySelectorAll('.trig').forEach(r=>{const w=r.querySelector('[data-tw]').value.trim().toLowerCase().replace(/[^\p{L}\p{N}_-]/gu,''),tg=r.querySelector('[data-tt]').value.trim().toLowerCase().replace(/^#/,'').replace(/[^\p{L}\p{N}_-]/gu,'');if(w&&tg)tr[w]=tg});settings.triggers=tr;saveSettings();render();toast('Trigger words saved')}
  if(a==='csv'||a==='json'){const arr=[...notes.values()].sort((x,y)=>x.created-y.created);let data,fn;
    if(a==='csv'){const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';data='created,type,text,tags,due,done,archived\n'+arr.map(n=>[new Date(n.created).toISOString(),n.kind,n.kind==='list'?[n.title,...(n.items||[]).map(i=>(i.d?'[x] ':'[ ] ')+i.t)].join('\n'):n.text,(n.tags||[]).join(' '),n.due||'',n.done,n.archived].map(q).join(',')).join('\n');fn='thoughtdrop.csv'}
    else{data=JSON.stringify({notes:arr},null,1);fn='thoughtdrop-backup.json'}
    if(dl)dl.save({filename:fn,data}).catch(()=>toast('Download cancelled'));
    else if(navigator.clipboard)navigator.clipboard.writeText(data).then(()=>toast('Copied to clipboard — paste it into a file'),()=>toast('Couldn’t export here'));
  }
  if(a==='notif'){try{Notification.requestPermission().then(p=>toast(p==='granted'?'Pop-up alerts on':'This browser blocked pop-up alerts')).catch(()=>toast('Pop-up alerts aren’t available here'))}catch(err){toast('Pop-up alerts aren’t available here')}}
  if(a==='purge'){const ar=[...notes.values()].filter(n=>n.archived).map(clone);if(!ar.length)return;ar.forEach(n=>{notes.delete(n.id);push(n.id)});lsSave();render();toast(`Deleted ${ar.length}`,()=>ar.forEach(n=>put(n)))}
});
addEventListener('hashchange',render);

/* ---------- due checks ---------- */
const fired=new Set();
setInterval(()=>{let any=false;notes.forEach(n=>{if(overdue(n)&&!fired.has(n.id)){fired.add(n.id);any=true;try{if(window.Notification&&Notification.permission==='granted')new Notification('ThoughtDrop reminder',{body:n.text})}catch(e){}}});if(any&&!dlg.open&&document.activeElement!==$('#q'))render()},30000);
notes.forEach(n=>{if(overdue(n))fired.add(n.id)});

applyAccent();render();initCloud();
if(location.hostname.endsWith("github.io")&&"serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
}
</script></body></html>
